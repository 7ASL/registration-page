<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Sign-up form</title>
    <link rel="stylesheet" type="text/css" href="animation.css">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div id="flex-container">
        <div id="image">
            <object type="image/svg+xml" data="img/mobile-encryption.svg" class="animated" id="panorama"></object>
            <div id="credit">
                <span>Image from <a href="https://magnific.com/"><strong>Magnific</strong></a></span>
            </div>
        </div>
        <div id="content-container">
            <div id="text">
                <span>Don't leave your personal information vulnerable to the modern web.
                    <br>Our platform seamlessly encrypts your device in the background,
                    <br>protecting you from data breaches and unauthorized access.</span>    
            </div>
            <div id="form-container">
                <h2>Sign up now to activate your shield!</h2>
                <form action="#" method="get" id="sign-up">
                    <div>
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" id="first-name" name="user-first" />
                    </div>
                    <div>
                        <label for="last-name">LAST NAME</label>
                        <input type="text" id="last-name" name="user-last" />
                    </div>
                    <div>
                        <label for="email">EMAIL</label>
                        <input type="email" id="emial" name="user-email" />
                    </div>
                    <div>
                        <label for="phone">PHONE NUMBER</label>
                        <input type="tel" id="phone" name="user-phone" />
                    </div>
                    <div>
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="user-password" />
                    </div>
                    <div>
                        <label for="password-repeat">CONFIRM PASSWORD</label>
                        <input type="password" id="password-repeat" name="user-password-repeat">
                    </div>
                </form>
            </div>
            <button type="submit" form="sign-up">Create Account</button>
            <a id="login" href="#">Already have an account? <strong>Log in</strong></a>
        </div>
    </div>
</body>
</html>
