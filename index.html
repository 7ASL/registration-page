<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Sign-up form</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div id="flex-container">
        <div id="image">
            <img src="img/picture.jpg" alt="Panoramic beach view" id="panorama">
            <div id="logo">
                <img src="img/odin-lined.png" alt="The Odin Project's Logo">
            </div>
            <div id="credit">
                <span>Photo by <a href="https://unsplash.com/photos/people-relaxing-on-a-sunny-beach-with-a-rocky-island-UzG8aE5IOmM">Nisa Yum</a> on <a href="https://unsplash.com/">Unsplash</a></span>
            </div>
        </div>
        <div id="content-container">
            <div id="text">
                <span>This is not a real online service! You know you need 
                something<br>like this in your life to help you realize 
                your deepest dreams.<br>Sign up now to get started.
                <br><br>You know you want to.</span>    
            </div>
            <div id="form-container">
                <h2>Let's do this!</h2>
                <form action="#" method="get" id="sign-up">
                    <div>
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" id="first-name" name="user-first" />
                    </div>
                    <div>
                        <label for="last-name">LAST NAME</label>
                        <input type="text" id="last-name" name="user-last" />
                    </div>
                    <div>
                        <label for="email">EMAIL</label>
                        <input type="email" id="emial" name="user-email" />
                    </div>
                    <div>
                        <label for="phone">PHONE NUMBER</label>
                        <input type="tel" id="phone" name="user-phone" />
                    </div>
                    <div>
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="user-password" />
                    </div>
                    <div>
                        <label for="password-repeat">CONFIRM PASSWORD</label>
                        <input type="password" id="password-repeat" name="user-password-repeat">
                    </div>
                </form>
            </div>
            <button type="submit" form="sign-up">Create Account</button>
            <a id="login" href="#">Already have an account? Log in</a>
        </div>
    </div>
</body>
</html>
